# dsh-research bundle layer: one row mounting the market panel.
#
#   dsh plugin --profile web add dsh-research
#
# Override from the profile's own cordis.patch.yml (a patch replaces the whole
# `config`, so restate every key you keep):
#
#   - id: research-market
#     config:
#       catalogUrl: https://example.org/v1/plugins
- insert:
    - id: research-market
      name: dsh-research
